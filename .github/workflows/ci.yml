name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential curl

      - name: Install Nox (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://noxlang.com/install.sh | bash
          echo "$HOME/.nox-lang/bin" >> $GITHUB_PATH

      - name: Install Nox (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          irm https://noxlang.com/install.ps1 | iex
          echo "$env:USERPROFILE\.nox-lang\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Nox Toolchain
        run: noxc version

      - name: Typecheck Prism Public Facade & Strict Concurrency Lint
        run: |
          noxc check prism.nox
          noxc check --strict-spawn-shared prism.nox
          noxc check --strict-spawn-shared pipeline/parallel.nox
          noxc check --strict-spawn-shared examples/capability_probe.nox
          noxc check --strict-spawn-shared examples/batch.nox

      - name: Verify Freestanding Pure-NOX Core, Transform & Filter Modules
        run: |
          noxc check --profile freestanding core/errors.nox
          noxc check --profile freestanding core/limits.nox
          noxc check --profile freestanding core/pixel.nox
          noxc check --profile freestanding core/color.nox
          noxc check --profile freestanding core/metadata.nox
          noxc check --profile freestanding core/options.nox
          noxc check --profile freestanding core/storage.nox
          noxc check --profile freestanding core/image.nox
          noxc check --profile freestanding transforms/crop.nox
          noxc check --profile freestanding transforms/border.nox
          noxc check --profile freestanding transforms/flip.nox
          noxc check --profile freestanding transforms/rotate.nox
          noxc check --profile freestanding transforms/resample.nox
          noxc check --profile freestanding transforms/resize.nox
          noxc check --profile freestanding transforms/affine.nox
          noxc check --profile freestanding transforms/geometry.nox
          noxc check --profile freestanding filters/enhance.nox
          noxc check --profile freestanding filters/effects.nox
          noxc check --profile freestanding filters/convolution.nox
          noxc check --profile freestanding filters/gaussian.nox
          noxc check --profile freestanding filters/sharpen.nox
          noxc check --profile freestanding filters/edges.nox
          noxc check --profile freestanding filters/median.nox
          noxc check --profile freestanding filters/morphology.nox
          noxc check --profile freestanding composite/alpha.nox
          noxc check --profile freestanding composite/blend.nox
          noxc check --profile freestanding composite/masks.nox
          noxc check --profile freestanding composite/layers.nox
          noxc check --profile freestanding draw/canvas.nox
          noxc check --profile freestanding draw/rasterizer.nox
          noxc check --profile freestanding draw/shapes.nox
          noxc check --profile freestanding draw/paths.nox
          noxc check --profile freestanding draw/text.nox
          noxc check --profile freestanding animation/frame.nox
          noxc check --profile freestanding animation/timeline.nox
          noxc check --profile freestanding animation/gif.nox
          noxc check --profile freestanding codecs/deflate.nox
          noxc check --profile freestanding codecs/sniff.nox
          noxc check --profile freestanding codecs/registry.nox
          noxc check --profile freestanding codecs/jpeg_adapter.nox
          noxc check --profile freestanding codecs/webp_adapter.nox
          noxc check --profile freestanding codecs/tiff_adapter.nox
          noxc check --profile freestanding codecs/gif.nox
          noxc check --profile freestanding pipeline/nodes.nox
          noxc check --profile freestanding pipeline/graph.nox
          noxc check --profile freestanding pipeline/planner.nox
          noxc check --profile freestanding pipeline/tiles.nox
          noxc check --profile freestanding pipeline/cache.nox
          noxc check --profile freestanding pipeline/executor.nox

      - name: Run Full Automated Test & Fuzz Suite (LLVM Backend)
        run: noxc test

      - name: Verify Cross-Backend Execution Matrix (QBE Backend)
        if: runner.os != 'Windows'
        run: noxc test --backend qbe

      - name: Run Representative Examples
        run: |
          noxc run examples/capability_probe.nox
          noxc run examples/create_checkerboard.nox
          noxc run examples/thumbnails.nox
          noxc run examples/avatar.nox
          noxc run examples/filters.nox
          noxc run examples/watermark.nox
          noxc run examples/animation_gif.nox
          noxc run examples/pipeline_demo.nox
          noxc run examples/batch.nox
